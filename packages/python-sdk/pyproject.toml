[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentlens-py"
version = "0.2.1"
description = "AgentLens Python SDK — zero-overhead observability for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "AgentLens Contributors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "httpx==0.28.1",
    "structlog==25.5.0",
]

[project.urls]
Homepage = "https://github.com/kp183/Agentlens"
Repository = "https://github.com/kp183/Agentlens"
Documentation = "https://github.com/kp183/Agentlens#readme"

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "hypothesis==6.152.9",
    "pytest-asyncio==1.3.0",
]
langgraph = [
    "langgraph>=0.0.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["agentlens"]
